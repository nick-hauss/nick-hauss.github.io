<style>
:root{
  --paper:#EDE9E3; --lift:#F7F4EF; --ink:#1B1A16; --soft:#57544A;
  --line:#CFC7B8; --pine:#2C4438;
  --display:Georgia,serif; --dw:400; --dls:-.015em;
  --util:"Archivo","Helvetica Neue",Arial,sans-serif;
  --gutter:clamp(22px,5vw,72px); --wrap:1280px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--util);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}

.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
padding:14px var(--gutter);color:var(--lift);transition:color .4s ease,background-color .4s ease,border-color .4s ease;
border-bottom:1px solid transparent}
.nav.solid{color:var(--ink);background-color:rgba(237,233,227,.92);border-bottom-color:var(--line);
-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mark{font-family:var(--util);font-weight:500;font-size:12px;letter-spacing:.2em;padding:6px 0}
.lang{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;font-weight:500}
.lang button{background:none;border:0;cursor:pointer;color:inherit;font-family:var(--util);font-size:11px;
letter-spacing:.16em;font-weight:500;padding:6px 2px;min-height:32px;opacity:.5;transition:opacity .3s ease}
.lang button:hover{opacity:.8}
.lang button.on{opacity:1;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.lang button:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.lang i{font-style:normal;opacity:.4;font-size:11px}

.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--gutter) clamp(28px,5vh,56px);overflow:hidden;background:var(--ink)}
.hero-media{position:absolute;inset:0;z-index:0}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;opacity:0;transition:opacity 1.4s ease}
.hero-media img.ready{opacity:.86}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,14,12,.82) 0%,rgba(15,14,12,.15) 55%,rgba(15,14,12,.35) 100%)}
.hero-inner{position:relative;z-index:2;color:var(--lift);max-width:var(--wrap);width:100%}
.hero h1{font-family:var(--display);font-weight:var(--dw);letter-spacing:var(--dls);font-size:clamp(52px,13vw,168px);line-height:.9}
.hero h1 .ln{display:block;overflow:hidden}
.hero h1 .ln i{display:block;font-style:normal;transform:translateY(105%);transition:transform 1.1s cubic-bezier(.19,1,.22,1)}
.hero.lit h1 .ln:nth-child(1) i{transform:translateY(0);transition-delay:.15s}
.hero.lit h1 .ln:nth-child(2) i{transform:translateY(0);transition-delay:.28s}
.hero-tag{margin-top:clamp(16px,2.6vh,26px);max-width:40ch;font-size:13px;color:rgba(247,244,239,.8);opacity:0;transform:translateY(14px);transition:opacity .9s ease .6s,transform .9s ease .6s}
.hero.lit .hero-tag{opacity:1;transform:none}
.comp{position:relative;z-index:2;width:100%;max-width:var(--wrap);margin-top:clamp(22px,4vh,40px);padding-top:14px;border-top:1px solid rgba(247,244,239,.22);display:flex;flex-wrap:wrap;gap:6px clamp(16px,3vw,42px);opacity:0;transform:translateY(12px);transition:opacity .9s ease .8s,transform .9s ease .8s}
.hero.lit .comp{opacity:1;transform:none}
.comp div{display:flex;gap:8px;align-items:baseline;color:rgba(247,244,239,.62);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.comp b{font-weight:500;color:var(--lift)}

.sec{padding:clamp(62px,9.5vh,126px) var(--gutter);max-width:var(--wrap);margin:0 auto}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(28px,4.5vh,52px)}
.sec-head .idx{font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--line);flex:none}
.sec-head .rule{flex:1;height:1px;background:var(--line)}

.statement .lead{font-family:var(--display);font-weight:var(--dw);letter-spacing:var(--dls);font-size:clamp(24px,3.3vw,42px);line-height:1.28;max-width:21ch}
.statement .body{margin-top:1.1em;max-width:34ch;font-size:clamp(16px,1.55vw,20px);color:var(--soft);line-height:1.65;letter-spacing:0}
.statement .note{font-family:var(--util);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:11px;line-height:1.9;color:var(--pine);max-width:46ch;margin-top:clamp(28px,5vh,52px);padding-top:16px;border-top:1px solid var(--line)}

.deliv{display:grid;grid-template-columns:1fr;gap:clamp(26px,3vw,44px)}
.deliv article{padding-top:16px;border-top:1px solid var(--line)}
.deliv h3{font-family:var(--display);font-weight:var(--dw);font-size:clamp(20px,2.3vw,28px);line-height:1.3}
.deliv p{font-size:14px;color:var(--soft);line-height:1.65;margin-top:10px;max-width:34ch}

.clients{display:grid;grid-template-columns:1fr;gap:clamp(34px,5vw,72px)}
.col h3{font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--pine);padding-bottom:12px;border-bottom:1px solid var(--line)}
.col ul{list-style:none;margin-top:6px}
.col li{font-family:var(--display);font-weight:var(--dw);font-size:clamp(21px,2.9vw,34px);line-height:1.55}
.col li i{font-style:normal;font-family:var(--util);font-weight:400;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-left:10px;vertical-align:middle}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(8px,1.1vw,16px)}
.cell{position:relative;overflow:hidden;background:var(--lift);grid-column:span 6}
.cell::before,.reel::before{content:attr(data-slot);position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--line)}
.cell img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.19,1,.22,1)}
.cell:hover img{transform:scale(1.035)}

.reels{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:clamp(8px,1.1vw,16px)}
.reel{position:relative;overflow:hidden;background:var(--lift);aspect-ratio:9/16}
.reel video{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}

.facts{border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px;padding-top:26px}
.facts dt{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);font-weight:500}
.facts dd{font-family:var(--display);font-weight:var(--dw);font-size:19px;margin-top:5px;line-height:1.35}

.contact{background:var(--ink);color:var(--lift);padding:clamp(76px,13vh,150px) var(--gutter)}
.contact-in{max-width:var(--wrap);margin:0 auto}
.contact h2{font-family:var(--display);font-weight:var(--dw);letter-spacing:var(--dls);font-size:clamp(34px,7vw,92px);line-height:1.05}
.contact .sub{margin-top:22px;max-width:36ch;font-size:14px;color:rgba(247,244,239,.72);line-height:1.75}
.links{margin-top:clamp(28px,4vh,46px);display:flex;flex-wrap:wrap;gap:14px clamp(24px,5vw,60px)}
.links a{font-family:var(--display);font-weight:var(--dw);font-size:clamp(19px,2.4vw,28px);padding-bottom:5px;border-bottom:1px solid rgba(247,244,239,.3);transition:border-color .35s ease}
.links a:hover{border-color:var(--lift)}
.links a:focus-visible{outline:1px solid var(--lift);outline-offset:5px}
.foot{margin-top:clamp(44px,8vh,90px);padding-top:18px;border-top:1px solid rgba(247,244,239,.16);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.foot i{font-style:normal;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(247,244,239,.5)}

body.dcaps .hero h1{text-transform:uppercase;font-size:clamp(32px,8vw,104px);line-height:1.1}
body.dcaps .contact h2{text-transform:uppercase;font-size:clamp(24px,4.6vw,58px);line-height:1.15}

.rv{opacity:0;transform:translateY(22px);transition:opacity .95s cubic-bezier(.19,1,.22,1),transform .95s cubic-bezier(.19,1,.22,1)}
.rv.in{opacity:1;transform:none}

@media(min-width:720px){
  .clients{grid-template-columns:1.1fr 1fr}
  .deliv{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:920px){
  .hero-inner{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;
    gap:0 clamp(32px,6vw,96px)}
  .hero-tag{margin-top:0;margin-bottom:.55em;max-width:26ch}
  .statement{display:grid;grid-template-columns:repeat(12,1fr);gap:0 clamp(18px,2.4vw,36px);
    align-items:end}
  .statement .lead{grid-column:1 / span 6;max-width:none}
  .statement .body{grid-column:8 / span 5;max-width:none;margin-top:0}
  .statement .note{grid-column:8 / span 5;max-width:none;margin-top:clamp(22px,3vh,34px)}
  .contact-in{display:grid;grid-template-columns:1.25fr 1fr;
    gap:0 clamp(32px,6vw,96px);align-items:end}
  .contact h2{grid-column:1 / 2}
  .contact .sub{grid-column:2 / 3;margin-top:0;margin-bottom:.5em}
  .links,.foot{grid-column:1 / 3}
  .facts{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .rv,.hero-tag,.comp{opacity:1;transform:none}
  .hero h1 .ln i{transform:none}
}
</style>
</head>

};
</script>
<!-- ==================== FINE PARTE MODIFICABILE ==================== -->

<nav class="nav">
  <a href="#top" class="mark" id="m-mark">NH</a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="btn-en" class="on">EN</button><i>/</i><button type="button" id="btn-it">IT</button><i>/</i><button type="button" id="btn-es">ES</button>
  </div>
</nav>

<main id="app"></main>

<noscript><div style="padding:40px 24px;font-family:Georgia,serif">
  <p style="font-size:28px">Nick Hauss — Fashion model</p>
  <p style="margin-top:16px">nick@nickhauss.com · instagram.com/nicola_hauss</p>
</div></noscript>

<script>
(function(){
  var S=SITE;

  var A="Archivo:wght@200;400;500;700";
  var FONTS={
    "archivo-light":{q:A, f:"'Archivo'", w:200, ls:".16em", caps:1},
    "archivo-mid"  :{q:A, f:"'Archivo'", w:500, ls:".11em", caps:1},
    "archivo-bold" :{q:A, f:"'Archivo'", w:700, ls:".05em", caps:1},
    "syne-light"   :{q:"Syne:wght@400;500;600", f:"'Syne'", w:400, ls:"-.005em", caps:0},
    "syne"         :{q:"Syne:wght@400;500;600", f:"'Syne'", w:600, ls:"-.015em", caps:0},
    "instrument"   :{q:"Instrument+Serif:ital,wght@0,400;1,400", f:"'Instrument Serif'", w:400, ls:"-.015em", caps:0},
    "cormorant"    :{q:"Cormorant+Garamond:wght@300;400", f:"'Cormorant Garamond'", w:300, ls:"-.005em", caps:0},
    "fraunces"     :{q:"Fraunces:opsz,wght@9..144,300;9..144,400", f:"'Fraunces'", w:300, ls:"-.01em", caps:0}
  };
  var F=FONTS[S.font]||FONTS["archivo-mid"];
  var lk=document.createElement('link');
  lk.rel='stylesheet';
  lk.href='https://fonts.googleapis.com/css2?family='+F.q+'&display=swap';
  document.head.appendChild(lk);
  var r=document.documentElement.style;
  r.setProperty('--display',F.f+',Georgia,serif');
  r.setProperty('--dw',F.w);
  r.setProperty('--dls',F.ls);
  if(F.caps) document.body.classList.add('dcaps');

  var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
  var t=function(o){return o?' data-en="'+esc(o.en)+'" data-it="'+esc(o.it)+'" data-es="'+esc(o.es||o.en)+'"':''};
  var txt=function(o){return o?esc(o.en):''};
  var secN=0;
  var head=function(o){secN++;var n=(secN<10?'0':'')+secN;
    return '<div class="sec-head"><span class="idx">'+n+'</span><span class="eyebrow"'+t(o)+'>'+txt(o)+'</span><span class="rule"></span></div>'};

  var h='';

  h+='<header class="hero" id="top">'
    +'<div class="hero-media"><img src="'+esc(S.hero.image)+'" alt="'+esc(S.hero.line1+' '+S.hero.line2)+'" id="heroimg"></div>'
    +'<div class="hero-inner"><h1><span class="ln"><i>'+esc(S.hero.line1)+'</i></span><span class="ln"><i>'+esc(S.hero.line2)+'</i></span></h1>'
    +'<p class="hero-tag"'+t(S.hero.tagline)+'>'+txt(S.hero.tagline)+'</p></div>'
    +'<div class="comp">'
    + S.measurements.map(function(m){return '<div><span'+t(m.label)+'>'+txt(m.label)+'</span><b'+t(m.value)+'>'+txt(m.value)+'</b></div>'}).join('')
    +'</div></header>';

  h+='<section class="sec statement rv">'
    +'<p class="lead"'+t(S.statement.lead)+'>'+txt(S.statement.lead)+'</p>'
    +'<p class="body"'+t(S.statement.body)+'>'+txt(S.statement.body)+'</p>'
    +'<p class="note"'+t(S.statement.note)+'>'+txt(S.statement.note)+'</p>'
    +'</section>';

  if(S.deliverables){
    h+='<section class="sec rv">'+head(S.deliverables.eyebrow)+'<div class="deliv">'
      + S.deliverables.items.map(function(d){
          return '<article><h3'+t(d.title)+'>'+txt(d.title)+'</h3><p'+t(d.text)+'>'+txt(d.text)+'</p></article>';
        }).join('')+'</div></section>';
  }

  h+='<section class="sec rv">'+head(S.clients.eyebrow)+'<div class="clients">'
    + S.clients.columns.map(function(c){
        return '<div class="col"><h3'+t(c.title)+'>'+txt(c.title)+'</h3><ul>'
          + c.items.map(function(i){
              var n=(i.note&&(i.note.en||i.note.it))?'<i'+t(i.note)+'>'+txt(i.note)+'</i>':'';
              return '<li>'+esc(i.name)+n+'</li>';
            }).join('')+'</ul></div>';
      }).join('')+'</div></section>';

  h+='<section class="sec rv">'+head(S.work.eyebrow)+'<div class="grid">'
    + S.work.images.map(function(im){
        return '<figure class="cell" data-slot="'+esc(im.src)+'" data-sp="'+(im.span||6)+'" style="aspect-ratio:'+esc(im.ratio)+'">'
          +'<img src="'+esc(im.src)+'" alt="" loading="lazy"></figure>';
      }).join('')+'</div></section>';

  h+='<section class="sec rv">'+head(S.motion.eyebrow)+'<div class="reels">'
    + S.motion.reels.map(function(x){
        return '<figure class="reel" data-slot="'+esc(x.video)+'"><video src="'+esc(x.video)+'" poster="'+esc(x.poster)+'" muted loop playsinline preload="none"></video></figure>';
      }).join('')+'</div></section>';

  h+='<section class="sec rv"><dl class="facts">'
    + S.facts.map(function(f){return '<div><dt'+t(f.label)+'>'+txt(f.label)+'</dt><dd'+t(f.value)+'>'+txt(f.value)+'</dd></div>'}).join('')
    +'</dl></section>';

  h+='<section class="contact" id="contact"><div class="contact-in rv">'
    +'<h2'+t(S.contact.title)+'>'+txt(S.contact.title)+'</h2>'
    +'<p class="sub"'+t(S.contact.sub)+'>'+txt(S.contact.sub)+'</p><div class="links">'
    +'<a href="mailto:'+esc(S.contact.email)+'">'+esc(S.contact.email)+'</a>'
    +'<a href="https://instagram.com/'+esc(S.contact.instagram)+'" target="_blank" rel="noopener">@'+esc(S.contact.instagram)+'</a>'
    +'</div><div class="foot"><i>'+esc(S.contact.footerLeft)+'</i>'
    +'<i><a href="privacy.html" style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(247,244,239,.35)"'+t(S.contact.privacy)+'>'+txt(S.contact.privacy)+'</a></i>'
    +'<i'+t(S.contact.footerRight)+'>'+txt(S.contact.footerRight)+'</i></div>'
    +'</div></section>';

  document.getElementById('app').innerHTML=h;
  document.getElementById('m-mark').textContent=S.mark;

  var wide=window.matchMedia('(min-width:720px)');
  function spans(){
    document.querySelectorAll('.grid .cell').forEach(function(c){
      c.style.gridColumn = wide.matches ? 'span '+(c.getAttribute('data-sp')||6) : 'span 6';
    });
  }
  spans(); wide.addEventListener('change',spans);

  var nav=document.querySelector('.nav');
  var nio=new IntersectionObserver(function(es){
    nav.classList.toggle('solid', !es[0].isIntersecting);
  },{rootMargin:'-70px 0px 0px 0px',threshold:0});
  nio.observe(document.querySelector('.hero'));

  var hero=document.querySelector('.hero'), hi=document.getElementById('heroimg');
  requestAnimationFrame(function(){hero.classList.add('lit')});
  if(hi){ if(hi.complete&&hi.naturalWidth) hi.classList.add('ready');
          hi.addEventListener('load',function(){hi.classList.add('ready')});
          hi.addEventListener('error',function(){hi.remove()}); }

  document.querySelectorAll('.cell img, .reel video').forEach(function(el){
    el.addEventListener('error',function(){el.remove()});
  });

  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)} });
  },{threshold:.12,rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});

  var vio=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){e.target.play().catch(function(){})} else {e.target.pause()} });
  },{threshold:.45});
  document.querySelectorAll('.reel video').forEach(function(v){vio.observe(v)});

  var BT={en:document.getElementById('btn-en'),it:document.getElementById('btn-it'),es:document.getElementById('btn-es')};
  function setLang(l){
    document.documentElement.lang=l;
    document.querySelectorAll('[data-'+l+']').forEach(function(n){n.textContent=n.getAttribute('data-'+l)});
    Object.keys(BT).forEach(function(k){ if(BT[k]) BT[k].classList.toggle('on', k===l) });
  }
  Object.keys(BT).forEach(function(k){ if(BT[k]) BT[k].addEventListener('click',function(){setLang(k)}) });
  var nav=(navigator.language||'').toLowerCase();
  if(nav.indexOf('it')===0) setLang('it');
  else if(nav.indexOf('es')===0) setLang('es');
})();
</script>
</body>
</html>
