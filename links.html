<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pt">Nick Hauss — Links</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDE9E3;--lift:#F7F4EF;--ink:#1B1A16;--soft:#57544A;--line:#CFC7B8;--pine:#2C4438;
--util:"Archivo","Helvetica Neue",Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--util);font-size:16px;-webkit-font-smoothing:antialiased;
min-height:100svh;display:flex;align-items:center;justify-content:center;padding:44px 20px}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:440px}
.top{text-align:center;margin-bottom:34px}
.avatar{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;overflow:hidden;background:var(--lift);position:relative}
.avatar::before{content:attr(data-i);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font-size:15px;font-weight:500;letter-spacing:.18em;color:var(--line)}
.avatar img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.top h1{font-weight:500;font-size:19px;letter-spacing:.15em;text-transform:uppercase;line-height:1.3}
.top p{font-size:12px;letter-spacing:.05em;color:var(--soft);margin-top:9px;line-height:1.6}
.grp{margin-top:30px}
.grp h2{font-size:10px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--pine);
padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:12px}
.grp.muted h2{color:var(--soft)}
.lnk{display:flex;align-items:center;justify-content:space-between;gap:14px;
padding:17px 18px;margin-bottom:9px;background:var(--lift);border:1px solid transparent;
transition:border-color .25s ease,transform .25s ease,background .25s ease}
.lnk:hover{border-color:var(--ink);transform:translateY(-2px)}
.lnk:focus-visible{outline:2px solid var(--pine);outline-offset:3px}
.lnk b{font-weight:500;font-size:13px;letter-spacing:.11em;text-transform:uppercase;line-height:1.4}
.lnk s{display:block;text-decoration:none;font-weight:400;font-size:11px;letter-spacing:.02em;
text-transform:none;color:var(--soft);margin-top:4px}
.lnk em{font-style:normal;font-size:15px;color:var(--soft);flex:none}
.lnk.hero{background:var(--ink);color:var(--lift)}
.lnk.hero s,.lnk.hero em{color:rgba(247,244,239,.6)}
.lnk.hero:hover{border-color:var(--ink);background:#000}
.lang{position:fixed;top:16px;right:18px;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;font-weight:500;color:var(--soft)}
.lang button{background:none;border:0;cursor:pointer;color:inherit;font-family:var(--util);font-size:11px;letter-spacing:.16em;font-weight:500;padding:6px 2px;min-height:32px;opacity:.5;transition:opacity .3s ease}
.lang button.on{opacity:1;color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.lang button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.lang i{font-style:normal;opacity:.4}
.foot{text-align:center;margin-top:34px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ================= MODIFICA SOLO QUI SOTTO ================= -->
<script>
const LINKS = {

  pageTitle: "Nick Hauss — Links",
  avatar:    "images/hero.jpg",
  initials:  "NH",
  name:      "Nick Hauss",
  bio: {
    en: "Model and wellness entrepreneur · Riccione, Italy",
    it: "Modello e imprenditore nel wellness · Riccione, Italia",
    es: "Modelo y emprendedor en wellness · Riccione, Italia"
  },
  arrow: "\u2192",

  groups: [
    {
      title: { en:"Model", it:"Model", es:"Model" },
      items: [
        { label:{en:"Portfolio", it:"Portfolio", es:"Portfolio"},
          sub:{en:"Book, campaigns, video", it:"Book, campagne, video", es:"Book, campañas, vídeo"},
          url:"https://nickhauss.com", hero:true },
        { label:{en:"Instagram", it:"Instagram", es:"Instagram"},
          sub:{en:"@nicola_hauss", it:"@nicola_hauss", es:"@nicola_hauss"},
          url:"https://instagram.com/nicola_hauss" },
        { label:{en:"Booking", it:"Booking", es:"Contratación"},
          sub:{en:"nick@nickhauss.com", it:"nick@nickhauss.com", es:"nick@nickhauss.com"},
          url:"mailto:nick@nickhauss.com" }
      ]
    },
    {
      title: { en:"Wellness", it:"Wellness", es:"Wellness" },
      muted: true,
      items: [
        { label:{en:"Your Best Self", it:"Your Best Self", es:"Your Best Self"},
          sub:{en:"Getting people to their best version", it:"Portare le persone alla loro versione migliore", es:"Llevar a las personas a su mejor versión"},
          url:"https://www.yourbestself.pro" }
      ]
    }
  ],

  footer: "nickhauss.com"
};
</script>
<!-- ================= FINE PARTE MODIFICABILE ================= -->

<div class="lang" role="group" aria-label="Language">
  <button type="button" id="btn-en" class="on">EN</button><i>/</i><button type="button" id="btn-it">IT</button><i>/</i><button type="button" id="btn-es">ES</button>
</div>
<div class="wrap" id="app"></div>

<script>
(function(){
  var L=LINKS, lang='en';
  var e=function(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
  var d=function(o){return o&&typeof o==='object'?' data-en="'+e(o.en)+'" data-it="'+e(o.it)+'" data-es="'+e(o.es||o.en)+'"':''};
  var v=function(o){return o&&typeof o==='object'?e(o.en):e(o)};

  document.getElementById('pt').textContent=L.pageTitle;
  var h='<div class="top"><div class="avatar" data-i="'+e(L.initials)+'"><img src="'+e(L.avatar)+'" alt="'+e(L.name)+'" id="av"></div>'
       +'<h1>'+e(L.name)+'</h1><p'+d(L.bio)+'>'+v(L.bio)+'</p></div>';

  h+= L.groups.map(function(g){
    return '<div class="grp'+(g.muted?' muted':'')+'"><h2'+d(g.title)+'>'+v(g.title)+'</h2>'
      + g.items.map(function(i){
          var ext=/^https?:/.test(i.url)?' target="_blank" rel="noopener"':'';
          return '<a class="lnk'+(i.hero?' hero':'')+'" href="'+e(i.url)+'"'+ext+'>'
            +'<b'+d(i.label)+'>'+v(i.label)+'</b>'
            +(i.sub?'<s'+d(i.sub)+'>'+v(i.sub)+'</s>':'')
            +'<em>'+e(L.arrow)+'</em></a>';
        }).join('')
      +'</div>';
  }).join('');
  h+='<div class="foot">'+e(L.footer)+' · <a href="privacy.html" style="color:inherit">Privacy</a></div>';
  document.getElementById('app').innerHTML=h;

  var av=document.getElementById('av'); if(av) av.addEventListener('error',function(){av.remove()});

  var BT={en:document.getElementById('btn-en'),it:document.getElementById('btn-it'),es:document.getElementById('btn-es')};
  function setLang(l){
    lang=l; document.documentElement.lang=l;
    document.querySelectorAll('[data-'+l+']').forEach(function(n){n.textContent=n.getAttribute('data-'+l)});
    Object.keys(BT).forEach(function(k){ if(BT[k]) BT[k].classList.toggle('on', k===l) });
  }
  Object.keys(BT).forEach(function(k){ if(BT[k]) BT[k].addEventListener('click',function(){setLang(k)}) });
  var n=(navigator.language||'').toLowerCase();
  if(n.indexOf('it')===0) setLang('it'); else if(n.indexOf('es')===0) setLang('es');
})();
</script>
</body>
</html>
